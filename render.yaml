services:
  - type: web
    name: vapor-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    buildCommand: |
      php artisan key:generate --force &&
      php artisan migrate --force &&
      php artisan storage:link &&
      php artisan config:cache &&
      php artisan route:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Europe/Kiev
      - key: APP_LOCALE
        value: ru
      - key: APP_FALLBACK_LOCALE
        value: ru
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
    disk:
      name: vapor-storage
      mountPath: /var/www/html/storage
      sizeGB: 1

