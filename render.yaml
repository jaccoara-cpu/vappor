services:
  - type: web
    name: vapor-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    buildCommand: |
      php artisan key:generate --force --show || true &&
      php artisan migrate --force &&
      php artisan storage:link &&
      php artisan config:clear &&
      php artisan cache:clear
    preDeployCommand: |
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: VAPOR
      - key: APP_KEY
        value: base64:KZ7ZcvhZd78pShCKFUQoHUmOKFdPXxay6HVTIqnerPI=
      - key: APP_URL
        value: https://vapor-backend-sy48.onrender.com
      - key: APP_DEBUG
        value: true
      - key: APP_TIMEZONE
        value: Europe/Kiev
      - key: APP_LOCALE
        value: ru
      - key: APP_FALLBACK_LOCALE
        value: ru
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/database/database.sqlite
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: file
      - key: TELEGRAM_BOT_TOKEN
        value: 8577074525:AAGusZJT_kPcjnOHVfRB22ZtJNteDGG1DlE
      - key: TELEGRAM_USER_ID
        value: 7736398733
    disk:
      name: vapor-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    # Note: Database file should be in persistent storage
    # We'll store it in storage/database to use the persistent disk

